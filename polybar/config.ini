# Status bar for bspwm.
#
# IMPORTANT: the wifi/eth interface names below (wlp0s20f3 / enp0s31f6) are
# THIS machine's names, not guaranteed elsewhere (e.g. the Arch notebook).
# Confirm with `ip -o link show` and edit [module/wifi] / [module/eth].
# Same idea for [module/battery]: confirm names under /sys/class/power_supply.

[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
foreground-alt = #6c7086
primary = #89b4fa
alert = #f38ba8
disabled = #6c7086

[bar/mainbar]
monitor = ${env:MONITOR:}
width = 100%
height = 24
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3
line-color = ${colors.primary}

padding-left = 1
padding-right = 1
module-margin = 1

font-0 = monospace:size=10;2

modules-left = bspwm
modules-center = xwindow
modules-right = notifications volume wifi eth battery date

cursor-click = pointer
enable-ipc = true

[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = true
enable-click = true
enable-scroll = false
reverse-scroll = false

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.primary}
label-focused-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-empty = ""
label-empty-padding = 0

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-empty = bspwm

[module/date]
type = internal/date
interval = 1
date = %H:%M:%S
date-alt = %a %d/%m/%Y %H:%M:%S
label = %date%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

label-charging = %percentage%% (chg)
label-discharging = %percentage%%
label-full = full

[module/wifi]
type = internal/network
interface = wlp0s20f3
interval = 3.0

label-connected = %essid%
label-disconnected =

[module/eth]
type = internal/network
interface = enp0s31f6
interval = 3.0

label-connected = %local_ip%
label-disconnected =

[module/notifications]
type = custom/text
format = notifications
click-left = ~/.config/Xorg/scripts/notif-history.sh

[module/volume]
type = custom/script
exec = wpctl get-volume @DEFAULT_AUDIO_SINK@ 2>/dev/null | awk '{ if ($0 ~ /MUTED/) print "mute"; else printf "%.0f%%", $2*100 }'
interval = 1
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
click-right = ghostty --class=ghostty.wiremix -e $HOME/.cargo/bin/wiremix
scroll-up = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[settings]
screenchange-reload = true
pseudo-transparency = false
