# Status bar for bspwm, ported from ~/Coding/dotfiles/config/polybar.
# Dropped vs. the source: tray, filesystem/xfce4-settings-manager button,
# Spotify modules, the rofi-applets powermenu (kept our own simpler one) --
# none of those have an equivalent set up on this machine.

[global/wm]
include-file = colors.ini
include-file = modules.ini

[bar/mainbar]
monitor = ${env:MONITOR:}
; width = 100%
; height = 26
; padding-left = 1
; padding-right = 0
background = ${colors.background}
foreground = ${colors.foreground}
bottom = true
; border-top-size = 7
; border-bottom-size = 7
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}
; offset-x = 1%
; offset-y = 0.5%
fixed-center = true
line-size = 1

wm-restack = bspwm

modules-left = round-left bspwm round-right
modules-center = xwindow
modules-right = temperature alsa battery space round-left cpu round-right mem wlan ethernet round-left time round-right notifications powermenu

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=12;3
font-1 = JetBrainsMono Nerd Font:size=16;5
font-2 = Material Design Icons:style=Bold:size=12;3
font-3 = unifont:fontformat=truetype:size=12:antialias=true;

cursor-click = pointer
enable-ipc = true

[settings]
screenchange-reload = true
pseudo-transparency = false
