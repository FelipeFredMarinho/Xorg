[module/round-left]
type = custom/text
content = %{T3} %{T-}
content-foreground = #2b2f37

[module/round-right]
type = custom/text
content = %{T3}%{T-}
content-foreground = #2b2f37

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 70

format = <ramp> <label>
format-warn = <ramp> <label-warn>
format-padding = 0
label = %temperature%
label-warn = %temperature%
ramp-0 = ""
ramp-foreground = #a4ebf3

[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = true
enable-click = true
enable-scroll = true
reverse-scroll = false

; ws-icon-N from the source dotfiles maps specific icons to 6 role-based
; workspaces -- doesn't fit our 10-11 generic numbered desktops (7+ would
; render blank), so kept on plain %name% instead.
label-focused = %name%
label-focused-foreground = ${colors.foreground}
label-focused-underline = #565c64
label-focused-padding = 1
label-focused-background = #2b2f37

label-occupied = %name%
label-occupied-foreground = #646870
label-occupied-background = #2b2f37
label-occupied-padding = 1

label-empty = ""
label-empty-padding = 0

label-urgent = %name%
label-urgent-foreground = #88C0D0
label-urgent-background = #2b2f37
label-urgent-padding = 1

; adapted from the source's [module/alsa]: same ramp icons, wpctl backend
; instead of amixer/internal-alsa (this machine uses pipewire/wireplumber)
[module/alsa]
type = custom/script
exec = wpctl get-volume @DEFAULT_AUDIO_SINK@ 2>/dev/null | awk -v off="" -v low="" -v high="" '{ if ($0 ~ /MUTED/) { printf "%s", off } else { v=$2*100+0.5; icon=(v<1?off:(v<50?low:high)); printf "%s  %d%%", icon, v } }'
interval = 1
format = <label>
format-padding = 2
label = %output%
label-foreground = #d35f5e
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
click-right = ghostty --class=ghostty.wiremix -e $HOME/.cargo/bin/wiremix
scroll-up = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[module/time]
type = internal/date
interval = 1
format = <label>
format-background = #2b2f37
date = %{F#888e96} %H:%M:%S%{F-}
time-alt = %{F#61afef}  %a, %b %d%{F-}

label = %date%%time%

[module/mem]
type = custom/script
exec = free -m | awk '/Mem/ {res=sprintf("%.1f", $3/1024); gsub(/\./, ",", res); print res " GiB"}'
format = <label>
format-foreground = #d19a66
format-prefix = "  ﬙"
label = %output%
label-padding = 1
format-prefix-foreground = #d19a66

[module/wlan]
type = internal/network
interface = wlp0s20f3
interval = 3.0
format-connected = <label-connected>
label-connected = "  "
label-connected-foreground = #A3BE8C
format-disconnected = <label-disconnected>
label-disconnected = "  "
label-disconnected-foreground = #D35F5E
click-left = ghostty --class=ghostty.impala -e impala

[module/ethernet]
type = internal/network
interface = enp0s31f6
format-connected = <label-connected>
format-connected-prefix = " "
format-connected-padding = 1
format-disconnected = <label-disconnected>
format-disconnected-prefix = " "
format-disconnected-padding = 1
label-connected = "%downspeed%|%upspeed%"
label-disconnected = "Offline"

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98

format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%

format-charging-padding = 1
format-charging-foreground = ${colors.color4}

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

format-discharging-foreground = ${colors.foreground}

format-full-prefix = " "

format-full-prefix-foreground = #A0E8A2
format-foreground = ${colors.color4}
format-background = #2b2f37

label-discharging-foreground = ${colors.foreground}

ramp-capacity-foreground = #A0E8A2
label-charging-foreground = ${colors.foreground}

ramp-capacity-0 = " "
ramp-capacity-1 = " "
ramp-capacity-2 = " "
ramp-capacity-3 = " "
ramp-capacity-4 = " "

animation-charging-0 = " "
animation-charging-1 = " "
animation-charging-2 = " "
animation-charging-3 = " "
animation-charging-4 = " "

animation-charging-foreground = #DF8890
animation-charging-framerate = 910
format-discharging-padding = 1

[module/notifications]
type = custom/text
content = " "
content-background = #2b2f37
click-left = ~/.config/Xorg/scripts/notif-history.sh

[module/powermenu]
type = custom/text
content = " "
content-padding = 1
click-left = ~/.config/Xorg/scripts/power-menu.sh
content-foreground = #d35f5e

[module/cpu]
type = internal/cpu
interval = 2.5

format-prefix = " "
format = <label>

label = CPU %percentage%%

format-background = #2b2f37
format-foreground = #989cff

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-empty = bspwm

[module/space]
type = custom/text
content = " "
